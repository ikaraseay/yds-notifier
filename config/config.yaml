# ============================================================================
# 研电赛通知订阅器 —— 业务规则配置（与部署环境无关，可安全入库）
#
# 所有站点信息、发信账号、密钥、URL 已迁至 .env（模板：.env.example）。
# 环境变量优先级高于本文件；本文件只描述「抓什么、怎么去重、怎么分组」。
# ============================================================================

# 去重状态文件（相对仓库根目录），由 GitHub Actions 自动提交回仓库
state_file: data/seen.json

# 状态文件最多保留多少条历史记录
state_keep: 800

# 首次运行策略：
#   baseline —— 把现有通知全部标记为已读，只推送最近 baseline_size 条（推荐）
#   all      —— 首次运行就把所有抓到的通知都发一遍
on_first_run: baseline
baseline_size: 8

# 邮件主题前缀（纯文案，不含任何环境信息）
subject_prefix: "【研电赛】"

# 单封邮件最多放多少条通知，超出自动分批
max_notify: 25

# ---------------- 新增能力相关的业务参数 ----------------
# 日报 / 周报的发送时刻（服务器本地时间，CI 已设 TZ=Asia/Shanghai）。
# 周报只在周一该时段发送。抓取每天两轮（10:00 / 20:00），只有上午那一轮
# 发摘要；GitHub 定时任务常延后 1–3 小时，digest_hour 起 8 小时内都算窗口，
# 20:00 那轮不在窗口内，不会一天发两次。
digest_hour: 10

# 赛事状态判定（AI）与已结束赛事的扫描节奏，默认开启。
# 判定结果缓存在 data/zones.json，每 14 天复核一次（一次调用批量判 19 项）。
# 判为「已结束」的赛事每 14 天才扫一次；进行中的仍每天扫。
# AI 不可用 / 判定失败时一律按「进行中」处理，宁可多扫也不漏通知。
# 判定口径：以「还有没有未来时间节点」为准；结果公示 / 获奖名单 / 证书 / 报销
# 等收尾公告是「已结束」的证据；官方赛程表缺少该赛事节点时强制保持每天扫。
# 注意：ended_scan_days 与 push_max_age_days 都取 14。超龄判定是严格的
# 「published < today - 14」，所以复扫延迟 1 天仍在窗口内；延迟 2 天以上时
# 最早那批通知才会只归档、不推送。想留更大缓冲可把 ended_scan_days 调到 12，
# 调整任一参数时需一并考虑另一端。
contest_status:
  enabled: true
  check_days: 14
  ended_scan_days: 14

# 每天抽检多少条「已读」通知的详情页，用于发现正文 / 附件被官网修订（0 表示关闭）。
# 按「上次复核日期」轮转，一圈覆盖全部条目；条数越多发现越快，但每条就是一次详情页请求。
full_check_limit: 12

# 同步到 Worker 的公开通知条数上限（归档页 / RSS / 日历共用）
notices_limit: 200

# 超过多少天的「新条目」只归档、不推送（仍会标记已读，历史从 seen.json 重建）。
# 每天两轮抓取，两轮间隔约 10 小时，14 天足够兜住官网迟发与单次 CI 失败；
# 再长只会把旧文推进邮件。
# 归档 / RSS / 日历不受影响：它们读的是全量条目，不按这个窗口裁剪。
push_max_age_days: 14

# 单轮新增超过该条数时按「追赶模式」处理：只推最近 catchup_size 条，
# 其余静默归档（仍可在归档页 / 日历看到），避免扩充数据源当天连发多封大邮件。
catchup_threshold: 10
catchup_size: 8

# AI 分析：每天第一轮最多为多少条「缓存中无结果」的历史通知补抓详情页正文。
# 首次接入 AI 时历史条目没有正文，靠这个参数渐进回填，收敛后不再请求官网。
# 只在上午第一轮执行（历史正文不必当天补完）。
# 0 表示只分析本轮抓过详情的通知（历史日历事件日不会补全）。
ai_backfill_limit: 12

# ---------------------------------------------------------------------------
# 数据源
#   enabled    : 是否启用
#   max_pages  : 向后翻多少页（每页约 10 条）。按「一页覆盖的日期跨度 ≥ 两轮间隔」
#                取最小值：更新慢的栏目只取 1 页，翻多了全是超龄旧文。
#   runs       : twice（默认，两轮都抓）/ daily（只在上午第一轮抓）。
#                年度通知、大赛文件、学会公告这类栏目一天最多一条，抓两遍是多余请求。
#   keywords   : 只保留标题包含任一关键词的条目；留空表示不过滤
#   allowed_hosts : 详情页允许抓取的域名白名单（防 SSRF，留空则用数据源默认 host）
# ---------------------------------------------------------------------------
sources:
  # 研创网（中国研究生创新实践系列大赛平台）—— 研电赛官方「大赛通知」栏目
  # contest: 6 是「电子设计竞赛」的赛事 id；其他赛事见 personas.CONTESTS 注释
  - key: cpipc
    enabled: true
    contest: 6
    max_pages: 1
    runs: twice
    allowed_hosts:
      - cpipc.acge.org.cn

  # 研创网「大赛通知」—— 覆盖 20 项主题赛事的公共通知（赛程一览、年度启动、暂停举办等）
  # 一年只更新几次，第 1 页已覆盖一年多的跨度，两轮都抓没有意义。
  - key: cpipc_pw
    enabled: true
    channel: notice
    max_pages: 1
    runs: daily
    allowed_hosts:
      - cpipc.acge.org.cn

  # 各主题赛事「独立专区」通知（20 项赛事里 19 个有专区，乡村振兴没有）。
  # 订阅者在控制台勾选关注的赛事后只抓这些赛事；无人限制时每轮扫全部进行中的
  # 专区，AI 判定为「已结束」的按 contest_status.ended_scan_days 降频。
  - key: cpipc_zones
    enabled: true
    max_pages: 1
    runs: twice
    allowed_hosts:
      - cpipc.acge.org.cn
    contests:
      - 智慧城市技术与创意设计大赛
      - 未来飞行器创新大赛
      - 数学建模竞赛
      - 电子设计竞赛
      - 创“芯”大赛
      - EDA精英挑战赛
      - 人工智能创新大赛
      - 机器人创新设计大赛
      - 能源装备创新设计大赛
      - 公共管理案例大赛
      - 乡村振兴科技强农+创新大赛
      - 网络安全创新大赛
      - “双碳”创新与创意大赛
      - 金融科技创新大赛
      - “美丽中国”创新设计大赛
      - 企业管理创新大赛
      - 操作系统开源创新大赛
      - “文化中国”两创大赛
      - 国际中文教育案例大赛
      - 智能建造创新大赛

  # 研创网「大赛新闻」—— 各赛事动态，更新最活跃，两轮都抓
  - key: cpipc_pw
    enabled: true
    channel: news
    max_pages: 1
    runs: twice
    allowed_hosts:
      - cpipc.acge.org.cn

  # 研创网「大赛文件」—— 章程、参赛说明、申报书等长期有效材料
  - key: cpipc_pw
    enabled: true
    channel: document
    max_pages: 1
    runs: daily
    allowed_hosts:
      - cpipc.acge.org.cn

  # 中国电子学会「通知公告」—— 主办方，全学科混排，必须靠关键词过滤。
  # 实测每页 10 条里研电赛相关通常为 0 条，且更新慢，全天只扫一次。
  - key: cie
    enabled: true
    max_pages: 2
    runs: daily
    keywords:
      - 电子设计竞赛
      - 研电赛
      - 研究生电子设计
      - 创新实践系列大赛
      - 研究生创新实践
    allowed_hosts:
      - www.cie.org.cn
      - cie.org.cn

# ---------------------------------------------------------------------------
# 官方赛程（《各主题赛事赛程一览》）与日程提醒
#   include  : 只为这些赛事生成截止提醒与日历事件，避免 20 项赛事刷屏
#   horizons : 在截止前第 N 天提醒（可多档）
#   refresh_days : 赛程表缓存天数，官网一年只更新一两次
# ---------------------------------------------------------------------------
schedule:
  enabled: true
  refresh_days: 7
  horizons: [30, 7, 3, 1]
  include:
    - 电子设计竞赛

# ---------------------------------------------------------------------------
# 人员视角（邮件分区顺序 = 阅读优先级）
#   key 与 Worker / AI 提示词的 audience 枚举一一对应
#   mail_to 留空表示跟随 MAIL_TO；填了则额外给该视角单独发一版
#   可选 contests: [电子设计竞赛, ...] 限定该邮箱只收这些赛事
# ---------------------------------------------------------------------------
personas:
  - key: student
    name: 参赛学生
    stages: [报名, 提交作品, 评审, 决赛, 公示, 获奖, 报销, 动态]
    mail_to: ""
  - key: advisor
    name: 指导教师
    stages: [报名, 提交作品, 评审, 决赛, 公示, 获奖, 报销, 动态]
    mail_to: ""
  - key: admin
    name: 培养单位
    stages: [资格审查, 缴费, 公示, 获奖, 报销, 承办]
    mail_to: ""
  - key: organizer
    name: 分赛区 / 承办方
    stages: [承办, 决赛]
    mail_to: ""

