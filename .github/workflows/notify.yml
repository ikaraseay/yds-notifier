name: 研电赛通知推送

on:
  # 每天两轮（UTC 02:00 / 12:00 = 北京时间 10:00 / 20:00）。
  # 上午那轮扫全部数据源并负责日报 / 周报；晚上那轮只扫更新活跃的源
  # （年度通知、大赛文件、学会公告等标记 runs: daily 的源留到次日上午）。
  # GitHub 对 schedule 有延迟，dispatch 给摘要窗口留了 8 小时余量。
  schedule:
    - cron: "0 2,12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: false
        default: normal
        type: choice
        options:
          - normal    # 正常抓取 + 发信
          - check     # 只抓取打印，不发信、不写状态

# 顶层不授予任何权限，收敛到具体 job
permissions: {}

# 上一轮没跑完时不并发，避免两次运行同时改状态文件
concurrency:
  group: yds-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # 仅用于把 data/seen.json、data/pending.json 提交回仓库
    # 配置放在 job 级：契约自测、入口自检、抓取发信都读同一份环境变量。
    # CI 上仓库里没有 .env，若只挂在「抓取」步骤，自测会因配置为空而失败。
    # 完整清单见 .env.example 的「CI」标注项；仓库内不含任何密钥。
    env:
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
      WORKERS_DEV_URL: ${{ secrets.WORKERS_DEV_URL }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER || 'resend' }}
      MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
      MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME || '研电赛通知' }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      REPLY_TO: ${{ secrets.REPLY_TO }}
      SITE_NAME: ${{ secrets.SITE_NAME || '研电赛通知订阅' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.qq.com' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
      SMTP_SECURITY: ${{ secrets.SMTP_SECURITY || 'ssl' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      UNSUB_URL: ${{ secrets.UNSUB_URL }}
      SUBSCRIBE_API_URL: ${{ secrets.SUBSCRIBE_API_URL }}
      UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
      UNSUB_TTL_DAYS: ${{ secrets.UNSUB_TTL_DAYS || '180' }}
      SUBSCRIBE_API_TOKEN: ${{ secrets.SUBSCRIBE_API_TOKEN }}
      # 归档 / RSS / 日历的数据同步；NOTICES_API_URL 不填时自动派生
      NOTICES_API_URL: ${{ secrets.NOTICES_API_URL }}
      PUBLISH_NOTICES: ${{ secrets.PUBLISH_NOTICES || 'true' }}
      # 抓取标识与 robots.txt 策略（见 README「数据来源与免责声明」）
      CRAWLER_UA: ${{ secrets.CRAWLER_UA }}
      RESPECT_ROBOTS: ${{ secrets.RESPECT_ROBOTS || 'enforce' }}
      # AI 分析（OpenAI 兼容接口，默认 DeepSeek）；提示词在 prompts/ 目录
      AI_ENABLED: ${{ secrets.AI_ENABLED || 'true' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.deepseek.com' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek-flash' }}
      AI_THINKING: ${{ secrets.AI_THINKING || 'false' }}
      AI_TEMPERATURE: ${{ secrets.AI_TEMPERATURE || '0.1' }}
      AI_MAX_TOKENS: ${{ secrets.AI_MAX_TOKENS || '4096' }}
      AI_TIMEOUT: ${{ secrets.AI_TIMEOUT || '60' }}
      AI_BATCH_SIZE: ${{ secrets.AI_BATCH_SIZE || '8' }}
      AI_MAX_BODY_CHARS: ${{ secrets.AI_MAX_BODY_CHARS || '3000' }}
      # 状态存储：填了 R2 就不再往仓库提交状态文件（见「保存状态」步骤）
      STATE_BACKEND: ${{ secrets.STATE_BACKEND || 'auto' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PREFIX: ${{ secrets.R2_PREFIX || 'state' }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 不联网的契约自测：退订签名格式、收件人校验、配置读取、变更检测
      - name: 配置与契约自测
        run: python -m yds.selftest

      # 入口自检：防止 __main__.py 只 import 不调用 main() 导致「假成功」
      - name: 入口自检
        run: |
          python -m yds --help | grep -q "usage: yds" || {
            echo "::error::python -m yds 未正确调用 main()"; exit 1;
          }

      - name: 抓取通知并发送邮件
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          if [ "$MODE" = "check" ]; then
            python -m yds --check
          else
            python -m yds
          fi

      # 成功心跳：配合外部 dead-man switch（Healthchecks / UptimeRobot / Better Stack），
      # 「该来没来」就会告警，能同时覆盖 Actions 被 60 天规则禁用、抓取静默停摆等情况。
      - name: 成功心跳
        if: success() && github.event.inputs.mode != 'check'
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "未配置 HEARTBEAT_URL，跳过心跳（建议在外部拨测服务创建）"
            exit 0
          fi
          curl -fsS --max-time 15 "$HEARTBEAT_URL" >/dev/null && echo "心跳已上报"

      # 把去重状态与摘要池提交回仓库，下次运行才知道发过什么、还有哪些摘要待发
      # 配了 R2 时状态由应用自己写对象存储，这一步整体跳过（仓库里不再有状态提交）
      - name: 保存状态
        if: always() && github.event.inputs.mode != 'check'
        run: |
          if [ -f data/.state-push-failed ]; then
            echo "::error::状态写回 R2 失败，下一轮可能重复推送：$(cat data/.state-push-failed)"
            exit 1
          fi
          if [ -n "$R2_BUCKET" ] && [ "$STATE_BACKEND" != "local" ]; then
            echo "状态已写入 R2（$R2_BUCKET/$R2_PREFIX），跳过 git 回写"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 本轮无变化时 state 不会写文件，此时不应让 workflow 失败；
          # 逐个判断存在性，避免某个可选文件缺失导致整条 git add 失败
          for f in data/seen.json data/pending.json data/ai.json data/schedule.json data/reminders.json data/zones.json; do
            [ -f "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新去重状态与摘要池 [skip ci]"
          pushed=0
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              echo "::error::rebase 失败，状态可能冲突"; exit 1;
            }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
            echo "推送失败，重试第 $i 次"; sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::状态回写失败（3 次重试耗尽），下一轮会重复推送，请人工检查"
            exit 1
          fi

  # 任何一步失败都立刻推送告警；未配置 webhook 时显式失败，避免「静默失败」
  alert:
    needs: notify
    if: failure() && needs.notify.result == 'failure'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 推送失败告警
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::通知推送失败，且未配置 ALERT_WEBHOOK_URL：${RUN_URL}"
            exit 1
          fi
          payload=$(jq -n --arg url "$RUN_URL" \
            '{text: "研电赛通知推送失败，请检查运行日志", run: $url}')
          curl -fsS --max-time 15 -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$WEBHOOK" >/dev/null || {
              echo "::error::告警发送失败，请检查 ALERT_WEBHOOK_URL"; exit 1;
            }
          echo "已推送失败告警"
