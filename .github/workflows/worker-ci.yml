name: Worker 校验

# 只做校验，不部署 —— 生产部署由 Cloudflare Workers Builds 在 push 到 main 时自动完成。
# 手动触发并勾选 deploy 时，可用 API Token 走一次兜底部署。
on:
  push:
    paths:
      - "cloudflare/**"
      - "frontend/**"
      - "config/**"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - "frontend/**"
      - "config/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "同时部署到 Cloudflare（需要 CLOUDFLARE_API_TOKEN）"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: 安装依赖
        working-directory: cloudflare
        run: npm ci

      - name: 类型检查
        working-directory: cloudflare
        run: npm run typecheck

      - name: 端到端测试
        working-directory: cloudflare
        run: npm test

      - name: 构建 dist/index.js
        working-directory: cloudflare
        run: npm run build

      - name: 兜底部署（仅手动勾选时）
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
