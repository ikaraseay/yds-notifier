name: 通知 Skill 网站组监控

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: notification-groups
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GROUP_RUNNER_TOKEN: ${{ secrets.GROUP_RUNNER_TOKEN }}
      SUBSCRIBE_API_TOKEN: ${{ secrets.SUBSCRIBE_API_TOKEN }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
      WORKERS_DEV_URL: ${{ secrets.WORKERS_DEV_URL }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      AI_ENABLED: ${{ secrets.AI_ENABLED || 'true' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.deepseek.com' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek-flash' }}
      AI_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backend.group_runner
