# 提示词版本注册表。
# 模型 / 温度 / max_tokens / thinking 不在这里配置，统一由 .env 的 AI_* 注入，
# 保证「换 provider 不改提示词」。active 变化会让 data/ai.json 缓存全量失效。

version: 1

prompts:
  notices:
    active: v2
    system: notices/v2.system.md
    user: notices/v2.user.md
    schema: schemas/analysis.v2.schema.json
    examples: schemas/examples.v2.json
    changelog:
      - version: v2
        date: 2026-11-06
        note: >-
          增加赛事名、阶段、人群与行动建议四类字段，供邮件分区 / 日历标签 /
          归档筛选使用。枚举值由 yds/personas.py 统一收敛，模型给非法值时丢弃
          并回退规则推断。升版会让 data/ai.json 全量失效（这是预期行为）。
      - version: v1
        date: 2026-11-06
        note: >-
          初版。一次批量输出分类、一句话摘要、紧急度与事件日期证据。
          采用「模型提议、代码决定」：日期只给原文片段，禁止模型换算，
          规避跨年补错年份与「把发布日期当事件日」两类问题。

  digest:
    active: v1
    system: digest/v1.system.md
    status: reserved
    note: 摘要邮件导语生成，第二期启用；当前不参与任何运行时调用。
